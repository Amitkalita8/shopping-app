# Render Blueprint: backend and website, one copy per branch. The databases are on Neon (free).
#
#   branch  API                    website                 address                          Neon branch
#   prod    shopping-app-api-prod  shopping-app-web-prod   https://atelierpsvogue.com       prod
#                                                          (API: https://api.atelierpsvogue.com)
#   master  shopping-app-api       shopping-app-web        https://shopping-app-web-1931.onrender.com   production
#   dev     shopping-app-api-dev   shopping-app-web-dev    https://dev.atelierpsvogue.com   dev
#
# In Render: New > Blueprint (or Sync on the existing one). It asks for, per API:
#   - DATABASE_URL: the Neon connection string, postgres://user:pass@host/db?sslmode=require
#   - DB_ADMIN_PASSWORD: the /db-admin login password (the user is root)
# On first start each API creates every table and loads the store's products by itself.
#
# Not a Render database: Render allows one free Postgres per workspace (already used by
# another project), and its free databases expire after 30 days. Neon's free plan does not.
#
# GoDaddy DNS for atelierpsvogue.com (no parking A records, no forwarding):
#   A      @    -> the IP Render shows for atelierpsvogue.com (usually 216.24.57.1)
#   CNAME  www  -> the onrender.com address of shopping-app-web-prod
#   CNAME  api  -> the onrender.com address of shopping-app-api-prod
#   CNAME  dev  -> shopping-app-web-dev.onrender.com
#
# Render added a suffix to master's names that were already taken: its API is
# https://shopping-app-api-it8x.onrender.com and its website https://shopping-app-web-1931.onrender.com.
# The prod website calls its API at api.atelierpsvogue.com, so prod does not depend on such suffixes.

services:
  # ======================= prod: the real shop on atelierpsvogue.com =======================
  - type: web
    name: shopping-app-api-prod
    runtime: docker
    branch: prod
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    domains:
      - api.atelierpsvogue.com
    envVars:
      # Neon "prod" branch: postgres://user:pass@host/db?sslmode=require (Render asks for it).
      - key: DATABASE_URL
        sync: false
      # Signs login sessions. Generated once by Render; changing it logs everyone out.
      - key: AUTH_SECRET
        generateValue: true
      # Public value, the same one the frontend uses.
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      # Websites allowed to call this API, comma separated, no trailing path.
      - key: FRONTEND_ORIGIN
        value: https://atelierpsvogue.com,https://www.atelierpsvogue.com
      # Login for the database browser at /db-admin. Render asks for the password; it is never committed.
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-web-prod
    runtime: static
    branch: prod
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    domains:
      - atelierpsvogue.com
      - www.atelierpsvogue.com
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Read at build time; changing it needs a redeploy of the site.
      - key: REACT_APP_API_BASE_URL
        value: https://api.atelierpsvogue.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      # Single-page app: every path is served index.html and React picks the page.
      - type: rewrite
        source: /*
        destination: /index.html

  # ======================= master: unchanged =======================
  - type: web
    name: shopping-app-api
    runtime: docker
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      - key: FRONTEND_ORIGIN
        value: https://shopping-app-web-1931.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-web
    runtime: static
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-it8x.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ======================= dev: testing on dev.atelierpsvogue.com =======================
  - type: web
    name: shopping-app-api-dev
    runtime: docker
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Neon "dev" branch, kept apart so testing never touches real orders.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      - key: FRONTEND_ORIGIN
        value: https://dev.atelierpsvogue.com,https://shopping-app-web-dev.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-web-dev
    runtime: static
    branch: dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    domains:
      - dev.atelierpsvogue.com
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-dev.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
