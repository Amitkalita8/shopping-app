# Render Blueprint: backend and website, one copy per branch. The databases are on Neon (free):
#   master -> Neon database "live" + shopping-app-api     + shopping-app-web     (live)
#   dev    -> Neon database "dev"  + shopping-app-api-dev + shopping-app-web-dev (testing)
#
# In Render: New > Blueprint (or Sync on the existing one). It asks for, per API:
#   - DATABASE_URL: the Neon connection string, postgres://user:pass@host/db?sslmode=require
#   - DB_ADMIN_PASSWORD: the /db-admin login password (the user is root)
# On first start each API creates every table and loads the store's products by itself.
#
# Not a Render database: Render allows one free Postgres per workspace (already used by
# another project), and its free databases expire after 30 days. Neon's free plan does not.
#
# Render added a suffix to names that were already taken, so the live addresses are
#   API https://shopping-app-api-it8x.onrender.com, website https://shopping-app-web-1931.onrender.com.
# If a service is ever recreated with a new address, update REACT_APP_API_BASE_URL and FRONTEND_ORIGIN.

services:
  # ---------- Backend (Go API) ----------
  - type: web
    name: shopping-app-api
    runtime: docker
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Neon "live" database: postgres://user:pass@host/db?sslmode=require (Render asks for it).
      - key: DATABASE_URL
        sync: false
      # Signs login sessions. Generated once by Render; changing it logs everyone out.
      - key: AUTH_SECRET
        generateValue: true
      # Public value, the same one the frontend uses.
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      # Websites allowed to call this API, comma separated, no trailing path.
      - key: FRONTEND_ORIGIN
        value: https://atelierpsvogue.com,https://www.atelierpsvogue.com,https://shopping-app-web-1931.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      # Login for the database browser at /db-admin. Render asks for the password; it is never committed.
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-api-dev
    runtime: docker
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Your own Postgres for testing, e.g. Neon: postgres://user:pass@host/db?sslmode=require
      # (kept apart from the live database so testing never touches real orders).
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      - key: FRONTEND_ORIGIN
        value: https://dev.atelierpsvogue.com,https://shopping-app-web-dev.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  # ---------- Website (React, static) ----------
  - type: web
    name: shopping-app-web
    runtime: static
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Read at build time; changing it needs a redeploy of the site.
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-it8x.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      # Single-page app: every path is served index.html and React picks the page.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: shopping-app-web-dev
    runtime: static
    branch: dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-dev.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
