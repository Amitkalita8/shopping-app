# Render Blueprint: backend and website, one copy per branch. The databases are on Neon (free).
#
#   branch  website (and API) address        services                                     Neon branch
#   master  https://atelierpsvogue.com        shopping-app-web + shopping-app-api          production
#           (also www., and shopping-app-web-1931.onrender.com)
#   dev     https://dev.atelierpsvogue.com    shopping-app-web-dev + shopping-app-api-dev  dev
#
# The live shop and its API share one address: the website calls https://atelierpsvogue.com/api/...,
# and the website service forwards those requests to shopping-app-api (see its routes).
#
# In Render: New > Blueprint (or Sync on the existing one). It asks for, per API:
#   - DATABASE_URL: the Neon connection string, postgres://user:pass@host/db?sslmode=require
#   - DB_ADMIN_PASSWORD: the /db-admin login password (the user is root)
# On first start each API creates every table and loads the store's products by itself.
#
# Not a Render database: Render allows one free Postgres per workspace (already used by
# another project), and its free databases expire after 30 days. Neon's free plan does not.
#
# GoDaddy DNS for atelierpsvogue.com (no "Parked" A record, no forwarding):
#   A      @    -> the IP Render shows for atelierpsvogue.com (usually 216.24.57.1)
#   CNAME  www  -> shopping-app-web-1931.onrender.com
#   CNAME  dev  -> shopping-app-web-dev.onrender.com
#
# Render added a suffix to master's names that were already taken: its API is
# https://shopping-app-api-it8x.onrender.com and its website https://shopping-app-web-1931.onrender.com.
# If the API is ever recreated with a new address, update the /api rule and FRONTEND_ORIGIN.

services:
  # ======================= master: the real shop on atelierpsvogue.com =======================
  - type: web
    name: shopping-app-api
    runtime: docker
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      - key: FRONTEND_ORIGIN
        value: https://atelierpsvogue.com,https://www.atelierpsvogue.com,https://shopping-app-web-1931.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-web
    runtime: static
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    domains:
      - atelierpsvogue.com
      - www.atelierpsvogue.com
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The API is reached on the shop's own address; the /api rule below forwards it.
      - key: REACT_APP_API_BASE_URL
        value: https://atelierpsvogue.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      # https://atelierpsvogue.com/api/... is served by the API service; the address bar stays the same.
      # This rule must stay above the catch-all rule.
      - type: rewrite
        source: /api/*
        destination: https://shopping-app-api-it8x.onrender.com/api/*
      # Single-page app: every other path is served index.html and React picks the page.
      - type: rewrite
        source: /*
        destination: /index.html

  # ======================= dev: testing on dev.atelierpsvogue.com =======================
  - type: web
    name: shopping-app-api-dev
    runtime: docker
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Neon "dev" branch, kept apart so testing never touches real orders.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      - key: FRONTEND_ORIGIN
        value: https://dev.atelierpsvogue.com,https://shopping-app-web-dev.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-web-dev
    runtime: static
    branch: dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    domains:
      - dev.atelierpsvogue.com
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-dev.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
