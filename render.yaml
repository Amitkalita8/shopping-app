# Render Blueprint: database, backend and website, one copy per branch.
#   master -> shopping-app-db (Render Postgres) + shopping-app-api     + shopping-app-web     (live)
#   dev    -> your own DATABASE_URL             + shopping-app-api-dev + shopping-app-web-dev (testing)
#
# In Render: New > Blueprint, pick this repository. It asks for:
#   - DB_ADMIN_PASSWORD for each API (the /db-admin login; user is root)
#   - DATABASE_URL for the dev API only (e.g. a free Neon database)
# On first start each API creates every table and loads the store's products by itself.
#
# Render allows one free Postgres database per account, so only the live API gets one here.
# A free Render database expires 30 days after it is created; upgrade its plan (basic-256mb)
# before then to keep the data.
#
# Render added a suffix to names that were already taken, so the live addresses are
#   API https://shopping-app-api-it8x.onrender.com, website https://shopping-app-web-1931.onrender.com.
# If a service is ever recreated with a new address, update REACT_APP_API_BASE_URL and FRONTEND_ORIGIN.

databases:
  - name: shopping-app-db
    databaseName: shopping_app
    user: shopping_app
    plan: free
    # Only Render services can connect; the data is viewed through /db-admin instead.
    ipAllowList: []

services:
  # ---------- Backend (Go API) ----------
  - type: web
    name: shopping-app-api
    runtime: docker
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Filled in by Render from the database above (private network address).
      - key: DATABASE_URL
        fromDatabase:
          name: shopping-app-db
          property: connectionString
      # Signs login sessions. Generated once by Render; changing it logs everyone out.
      - key: AUTH_SECRET
        generateValue: true
      # Public value, the same one the frontend uses.
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      # Websites allowed to call this API, comma separated, no trailing path.
      - key: FRONTEND_ORIGIN
        value: https://shopping-app-web-1931.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      # Login for the database browser at /db-admin. Render asks for the password; it is never committed.
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  - type: web
    name: shopping-app-api-dev
    runtime: docker
    branch: dev
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Your own Postgres for testing, e.g. Neon: postgres://user:pass@host/db?sslmode=require
      # (kept apart from the live database so testing never touches real orders).
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
      - key: FRONTEND_ORIGIN
        value: https://shopping-app-web-dev.onrender.com,https://amitkalita8.github.io,https://shopping-app-bay-five.vercel.app
      - key: DB_ADMIN_USER
        value: root
      - key: DB_ADMIN_PASSWORD
        sync: false

  # ---------- Website (React, static) ----------
  - type: web
    name: shopping-app-web
    runtime: static
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Read at build time; changing it needs a redeploy of the site.
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-it8x.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      # Single-page app: every path is served index.html and React picks the page.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: shopping-app-web-dev
    runtime: static
    branch: dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_BASE_URL
        value: https://shopping-app-api-dev.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 1063209695755-i9upu09e2j1mfg0jj22fpjs3ulesaflo.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
