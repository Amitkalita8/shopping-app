<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Atelier PS Vogue</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves only this root 404.html for every missing path. The site lives at
      // /shopping-app/ (master) and /shopping-app/dev/ (dev branch), so keep 1 or 2 leading segments.
      var pathSegmentsToKeep = window.location.pathname.split('/')[2] === 'dev' ? 2 : 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
